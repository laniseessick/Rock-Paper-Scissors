<!DOCTYPE html>
<html lang="en">
<div id="gameUI" class="interface">
    <head>
        <title>Rock, Paper,Scissors</title>
        <link rel="stylesheet"  href="gameUI.css">
    </head>
    <body>
        <h1 class="title">Lets Play Paper, Scissors, Rock!</h1>
        <div id="scores">
            <div class="score-title">SCOREBOARD</div>

            <div class="score">
                <div class="label"> Player</div>
                <div id="player-score"></div>
            </div>

            <div class="score">
                <div class="label"> Computer</div>
                <div id="ai-score"></div>
            </div>
        </div>

        <div id="controls">
            <button id="paper" class="buttons"> Paper </button>
            <button id="scissors" class="buttons"> Scissors </button>
            <button id="rock" class="buttons"> Rock </button>
        </div>

        <div id="results">
            <div class="result">
                <div id="player-result"></div>
                <div class="result-txt">Player</div>
            </div>
            <div class="result">
                <div id="ai-result"></div>
                <div class="result-txt">Computer</div>
            </div>
        </div>
        
    </body>
</div>
    <script src="script.js"></script>
</html>
